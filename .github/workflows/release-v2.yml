name: Build & Release Locknote AI

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < VERSION)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag must match VERSION ($tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            suffix: macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            suffix: macos-x86_64
          - os: windows-2022
            platform: windows
            arch: x86_64
            suffix: windows
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            suffix: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="temporary-keychain-password"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$SIGN_ID" ]; then
            echo "No Developer ID Application signing identity found in APPLE_CERTIFICATE." >&2
            echo "This workflow is for notarized GitHub Release builds, so APPLE_CERTIFICATE must be a Developer ID Application .p12 certificate, not an Apple Development certificate." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi

          echo "MACOS_SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not $env:WIX) { throw "WiX Toolset is missing from the Windows runner" }
          (Join-Path $env:WIX 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            wails build -clean -skipbindings -o locknote-ai.exe -platform windows/amd64 -nsis
          else
            wails build -clean -skipbindings -o locknote-ai
          fi

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          APP_PATH="$(find build/bin -maxdepth 1 -name "*.app" -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build/bin" >&2
            exit 1
          fi

          codesign \
            --force \
            --deep \
            --timestamp \
            --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MACOS_SIGN_ID" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          NOTARY_ZIP="$RUNNER_TEMP/locknote-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # notarytool --wait above must succeed before continuing. Apple can
          # still return NSURLErrorDomain -1005 from CloudKit when stapler tries
          # to fetch the ticket. Retry for longer, but do not fail an otherwise
          # notarized release solely because Apple's ticket-delivery endpoint
          # is temporarily unreachable. A non-stapled notarized app can still
          # be verified by Gatekeeper online; stapling is preferable for offline use.
          retry_stapler() {
            local description="$1"
            shift
            local attempt
            local delay
            for attempt in 1 2 3 4 5; do
              echo "$description (attempt $attempt/5)"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                delay="$((attempt * 15))"
                echo "Retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            echo "$description failed after 5 attempts." >&2
            return 1
          }

          if retry_stapler "Stapling notarization ticket" xcrun stapler staple "$APP_PATH"; then
            if retry_stapler "Validating stapled notarization ticket" xcrun stapler validate "$APP_PATH"; then
              spctl --assess --type execute --verbose "$APP_PATH"
            else
              echo "::warning::Ticket stapling was attempted, but stapler validation could not complete. Continuing because notarytool submission succeeded; please verify the release artifact when Apple's service recovers."
            fi
          else
            echo "::warning::Apple's CloudKit ticket-delivery endpoint was unreachable, so the notarization ticket could not be stapled. Continuing because notarytool submission succeeded. The app may require an internet connection for Gatekeeper's online notarization check."
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "locknote-ai-$env:RELEASE_VERSION-windows"
          $installers = @(Get-ChildItem build/bin -Filter '*installer.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          Copy-Item $installers[0].FullName "dist/$name.exe"
          $binary = (Resolve-Path build/bin/locknote-ai.exe).Path
          candle.exe -nologo -arch x64 "-dVersion=$env:RELEASE_VERSION" "-dBinary=$binary" -out build/packaging/windows.wixobj build/packaging/windows.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX compilation failed" }
          light.exe -nologo -spdb -out "dist/$name.msi" build/packaging/windows.wixobj
          if ($LASTEXITCODE -ne 0) { throw "MSI linking failed" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH="$(find build/bin -maxdepth 1 -name "*.app" -type d | head -n 1)"
          test -n "$APP_PATH"
          name="locknote-ai-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          ditto "$APP_PATH" "$staging/Locknote AI.app"
          cp LICENSE "$staging/LICENSE"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Locknote AI" -srcfolder "$staging" -ov -format UDZO "dist/$name.dmg"
          tar -czf "dist/$name.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: locknote-ai-${{ matrix.suffix }}
          path: dist/locknote-ai-*
          if-no-files-found: error

  release:
    needs: [build, version]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git push origin "refs/tags/$TAG"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: locknote-ai-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum locknote-ai-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Locknote AI ${{ needs.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
